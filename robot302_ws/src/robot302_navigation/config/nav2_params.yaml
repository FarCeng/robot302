amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    tf_broadcast: true
    update_min_d: 0.1
    update_min_a: 0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: false

    # Pertahankan seperti config lama yang stabil
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]


    # ============================================================
    # PROGRESS CHECKER
    # ============================================================

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0


    # ============================================================
    # GOAL CHECKER
    # ============================================================

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      # Setelah posisi XY tercapai, fokus menyelesaikan yaw.
      stateful: true

      xy_goal_tolerance: 0.30

      # Tidak terlalu sempit karena robot fisik
      # masih punya dead-zone saat pivot.
      yaw_goal_tolerance: 0.1

      symmetric_yaw_tolerance: false


    # ============================================================
    # DWB LOCAL PLANNER
    # ============================================================

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: true


      # ==========================================================
      # LINEAR
      # ==========================================================

      # Pertahankan config lama.
      # Robot tetap diperbolehkan maju dan mundur.
      min_vel_x: -0.50
      max_vel_x: 0.50

      min_vel_y: 0.0
      max_vel_y: 0.0

      min_speed_xy: 0.01
      max_speed_xy: 0.35


      # ==========================================================
      # ANGULAR
      # ==========================================================

      # DULU:
      # max_vel_theta = 6.0
      #
      # Firmware lama:
      # 6.0 * 0.7 = 4.2
      #
      # Firmware baru:
      # ~1.0 * 3.85 = 3.85
      #
      # Jadi kemampuan rotate tetap dekat dengan sebelumnya,
      # tetapi Nav2 tidak mengirim angular ekstrem.
      max_vel_theta: 1.65

      # Jangan paksa minimum angular besar.
      #
      # Parameter ini adalah minimum angular speed DWB,
      # bukan minimum PWM motor.
      min_speed_theta: 1.55


      # ==========================================================
      # ACCELERATION
      # ==========================================================

      # Linear sama seperti config lama.
      acc_lim_x: 0.8
      decel_lim_x: -0.8

      acc_lim_y: 0.0
      decel_lim_y: 0.0

      # DULU:
      # 9.0 * 0.7 = 6.3 effective
      #
      # Sekarang:
      # 1.5 * 3.85 = 5.775 effective
      #
      # Jadi cukup dekat dengan respons firmware lama.
      acc_lim_theta: 2.9
      decel_lim_theta: -2.9


      # ==========================================================
      # SAMPLING
      # ==========================================================

      # Pertahankan style config lama.
      vx_samples: 20

      vy_samples: 1

      # Sedikit ditambah supaya range -1..+1 punya
      # pilihan angular yang lebih halus.
      vtheta_samples: 32


      # ==========================================================
      # TRAJECTORY SIMULATION
      # ==========================================================

      # Pertahankan config yang sebelumnya stabil.
      sim_time: 1.2

      short_circuit_trajectory_evaluation: true


      # ==========================================================
      # CRITICS
      # ==========================================================

      # Sengaja TIDAK menambahkan PathAlign / GoalAlign dulu.
      #
      # Karena config lama sudah stabil tanpa critic tersebut.
      # Kita ingin memperbaiki angular, bukan mengubah
      # karakter path following keseluruhan.
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "PathDist",
          "GoalDist"
        ]


      # ==========================================================
      # ROTATE TO GOAL
      # ==========================================================

      # Hanya dibuat lebih kuat pada fase akhir goal.
      #
      # RotateToGoal memang khusus bekerja dekat posisi goal,
      # jadi tidak seharusnya menyebabkan robot zigzag
      # sepanjang lintasan.
      RotateToGoal.scale: 10.0

      RotateToGoal.slowing_factor: 5.0

      RotateToGoal.trans_stopped_velocity: 0.05


      # ==========================================================
      # OSCILLATION
      # ==========================================================

      # Sedikit lebih kuat dari config lama,
      # tapi tidak dibuat ekstrem.
      Oscillation.scale: 2.0


      # ==========================================================
      # OBSTACLE / PATH
      # ==========================================================

      # Pertahankan persis dari config lama yang stabil.
      BaseObstacle.scale: 48.0

      PathDist.scale: 32.0

      GoalDist.scale: 40.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      footprint: "[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]"
      plugins: ["obstacle_layer","inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 2.0
          raytrace_max_range: 2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: "[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]"
      plugins: ["static_layer","inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 10.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin","backup","drive_on_heading","wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

smoother_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [controller_server,planner_server,behavior_server,bt_navigator,waypoint_follower]

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server,amcl]