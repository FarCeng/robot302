amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    tf_broadcast: true
    update_min_d: 0.1
    update_min_a: 0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: false

    # Pertahankan seperti config lama yang stabil
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]


    # ============================================================
    # PROGRESS CHECKER
    # ============================================================

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0


    # ============================================================
    # GOAL CHECKER
    # ============================================================

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      # Setelah posisi XY tercapai, fokus menyelesaikan yaw.
      stateful: true

      xy_goal_tolerance: 0.30

      # Tidak terlalu sempit karena robot fisik
      # masih punya dead-zone saat pivot.
      yaw_goal_tolerance: 0.1

      symmetric_yaw_tolerance: false


    # ============================================================
    # DWB LOCAL PLANNER
    # ============================================================

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -0.50
      max_vel_x: 0.50
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_speed_xy: 0.01
      max_speed_xy: 0.35
      max_vel_theta: 1.65
      min_speed_theta: 1.55
      acc_lim_x: 0.8
      decel_lim_x: -0.8
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 2.9
      decel_lim_theta: -2.9
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 32
      sim_time: 2.0
      short_circuit_trajectory_evaluation: true
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "PathDist",
          "GoalDist",
          "PathAlign"
        ]
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.trans_stopped_velocity: 0.05
      Oscillation.scale: 2.0
      BaseObstacle.scale: 48.0
      PathDist.scale: 5.0
      GoalDist.scale: 24.0
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.2


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_footprint

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      update_frequency: 10.0
      publish_frequency: 5.0

      footprint: "[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 2.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_footprint
      
      update_frequency: 5.0
      publish_frequency: 2.0
      
      resolution: 0.05
      footprint: "[[0.20,0.15],[0.20,-0.15],[-0.20,-0.15],[-0.20,0.15]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 10.0

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

smoother_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [controller_server,planner_server,behavior_server,bt_navigator,waypoint_follower]

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server,amcl]